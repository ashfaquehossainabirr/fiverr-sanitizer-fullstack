<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fav_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiverr Message Sanitizer</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Initial splash: shown instantly (no JS bundle / CSS import needed)
         while the app boots, then faded out and removed by main.jsx. -->
    <div id="initial-loader">
      <span class="il-mark">
        <span class="il-mark-text">FS</span>
        <span class="il-scan"></span>
      </span>
      <p class="il-label">Loading<span class="il-dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #F3F6F5;
        transition: opacity 0.25s ease;
      }
      #initial-loader.il-hide {
        opacity: 0;
        pointer-events: none;
      }
      .il-mark {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #10241D;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(16, 36, 29, 0.08);
      }
      .il-mark-text {
        position: relative;
        z-index: 1;
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        font-weight: 600;
        font-size: 17px;
        color: #0E9F6E;
        letter-spacing: 0.01em;
      }
      .il-scan {
        position: absolute;
        left: -10%;
        right: -10%;
        height: 3px;
        top: -10%;
        background: linear-gradient(90deg, transparent, #0E9F6E 50%, transparent);
        box-shadow: 0 0 10px 1px #0E9F6E;
        animation: il-scan-move 1.5s ease-in-out infinite;
      }
      @keyframes il-scan-move {
        0% { top: -10%; }
        50% { top: 100%; }
        100% { top: -10%; }
      }
      .il-label {
        display: inline-flex;
        align-items: center;
        margin: 0;
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 13px;
        color: #4C5F58;
        letter-spacing: 0.02em;
      }
      .il-dots {
        display: inline-flex;
        margin-left: 2px;
      }
      .il-dots span {
        animation: il-dot-blink 1.4s infinite;
        opacity: 0;
      }
      .il-dots span:nth-child(2) { animation-delay: 0.2s; }
      .il-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes il-dot-blink {
        0%, 80%, 100% { opacity: 0; }
        40% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .il-scan, .il-dots span { animation: none; }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
